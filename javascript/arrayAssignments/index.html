<body>
    <div class="container p-3">

            <div class="input-group mb-3">
                <input type="text" class="form-control me-2" placeholder="Enter Task" id="inputTask">

 <div class="container p-3">
        <h1 class="display-4 text-center">5. Sort Names Alphabetically
</h1>
        <div class="container w-50">
            <div class="input-group mb-3">
                <input type="text" class="form-control me-2" placeholder="Enter Task" id="inputName">
                <button class="btn btn-primary me-2" onclick="addNewName()">Add Name</button>

</div>
