<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link

    <style>

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .main-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        /* Left OTP Card */

        .otp-card {
            background: #ffffff;
            border-radius: 15px;
            padding: 45px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .otp-icon {
            font-size: 85px;
            color: #34495e;
            position: relative;
        }

        .lock-icon {
            font-size: 42px;
            color: #ffc107;
            margin-left: -25px;
            margin-bottom: -40px;
        }

        .otp-title {
            font-size: 32px;
            font-weight: 600;
            margin-top: 40px;
            color: #212529;
        }

        .otp-text {
            font-size: 18px;
            color: #6c757d;
        }

        /* OTP Inputs */

        .otp-inputs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 35px;

        .otp-input {

            height: 60px;
            text-align: center;
            font-size: 24px;

            border: 2px solid #dee2e6;
            border-radius: 12px;
            outline: none;
        }

        .otp-input:focus {
            border-color: #4da8c7;
            box-shadow: 0 0 0 0.2rem rgba(77, 168, 199, 0.2);
        }

        /* Verify Button */

        .verify-btn {
            margin-top: 35px;
            height: 55px;
            background-color: #7fc2d9;
            border: none;

        .verify-btn:hover {

        }

        /* Right Side */

        .right-section {
            color: white;
            padding: 50px;

            font-size: 80px;
            font-weight: bold;
            line-height: 1.1;
        }

        .right-section p {

        }
        /* OTP Generator */

.otp-generator {
    position: fixed;

}

.otp-generator button {

        <div class="row w-100 align-items-center">

            <!-- Right Section -->

                        Form

                        HTML, CSS & JavaScript
                    </p>

                </div>

            </div>

        </div>

    </div>


    <!-- JavaScript -->

    <script>
        const generateOtpBtn = document.getElementById("generateOtpBtn");
const generatedOtp = document.getElementById("generatedOtp");

let generatedOTP = "";

generateOtpBtn.addEventListener("click", function () {

    // Generate 4-digit OTP
    generatedOTP = Math.floor(1000 + Math.random() * 9000);

    // Display OTP
    generatedOtp.textContent = "OTP: " + generatedOTP;

    console.log("Generated OTP:", generatedOTP);
});

        const otpInputs = document.querySelectorAll(".otp-input");

        otpInputs.forEach((input, index) => {

            input.addEventListener("input", function () {

                // Allow only numbers
                this.value = this.value.replace(/[^0-9]/g, "");

                // Move to next input
                if (
                    this.value.length === 1 &&
                    index < otpInputs.length - 1
                ) {
                    otpInputs[index + 1].focus();
                }

            });


            input.addEventListener("keydown", function (event) {

                // Move to previous input on Backspace

                if (
                    event.key === "Backspace" &&
                    this.value === "" &&
                    index > 0
                ) {
                    otpInputs[index - 1].focus();
                }

            });

        });


        // Verify OTP

        const verifyBtn = document.getElementById("verifyBtn");


       verifyBtn.addEventListener("click", function () {

    let enteredOTP = "";

    otpInputs.forEach((input) => {
        enteredOTP += input.value;
    });

    if (generatedOTP === "") {
        alert("Please generate OTP first.");
        return;
    }

    if (enteredOTP.length !== 4) {
        alert("Please enter complete OTP.");
        return;
    }

    if (enteredOTP == generatedOTP) {
        alert("OTP Verified Successfully! ✅");
          // Move to home page
        window.location.href = "homeOTP.html";
    } else {
        alert("Invalid OTP ❌");
    }

});
    </script>
