<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <style>
        h1, h2{
            display: none;
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div  class="container d-flex justify-content-center align-items-center">
    <div  class="spinner-grow text-dark" role="status" id="loader">
        <span class="visually-hidden">Loading...</span>
    </div>
    </div>
    <h1 id="dataElmt">Hello, world!</h1>
    <h2 id="timneElmt"><span id="hr"></span>:<span id="min"></span>:<span id="sec"></span></h2>

    <script>
        setTimeout(()=>{
            document.querySelector("#loader").style.display = "none"
            document.querySelector("#dataElmt").style.display = "block"
            document.querySelector("#timneElmt").style.display = "block"

        },3000)
    </script>

<script>
    function showTime(){
    const today = new Date()
    const hour = today.getHours()
    document.getElementById("hr").textContent = hour
    const minute = today.getMinutes()
    document.getElementById("min").textContent = minute
    const seconds = today.getSeconds()
    document.getElementById("sec").textContent = seconds
    }

    setInterval(showTime, 1000)
</script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
