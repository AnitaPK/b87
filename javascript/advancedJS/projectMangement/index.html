<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <h1>Hello, world!</h1>
    <div class="container">
        <!-- Search & Filters -->
<div class="row g-3 mb-4">

    <!-- Search by Project Title -->
    <div class="col-md-4">

        <input
            type="text"
            id="searchProject"
            class="form-control"
            placeholder="Search by project title..."
        >
        <button onclick="SearchByTitle()">Search</button>
    </div>


    <!-- Filter by Department -->
    <div class="col-md-4">
        <label for="departmentFilter" class="form-label">
            Department
        </label>
        <div id="deptRender"></div>
    </div>


    <!-- Filter by Priority -->
    <div class="col-md-4">
        <label for="priorityFilter" class="form-label">
            Priority
        </label>

        <select id="priorityFilter" class="form-select">
            <option value="">All Priorities</option>
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
        </select>
    </div>

</div>
    </div>
    <div class="container">
        <div style="overflow-y: auto;height: 800px;">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">
                            Project Name (Details)</th>
                        <th scope="col">Department</th>
                        <th scope="col">Priority</th>
                        <th scope="col">Start Date</th>
                        <th scope="col">End Date</th>
                        <th scope="col">Status</th>
                    </tr>
                </thead>
                <tbody id="projectList"></tbody>
            </table>
        </div>
        <nav aria-label="Page navigation example">
            <ul class="pagination justify-content-center" id="pagination1"></ul>
        </nav>
    </div>
    <script src="./script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>


<!-- 

pageNumber = 1 
numberOfProjects = 10 
TotalProjects = projects.length 


TotalPages = TotalProjects/numberOfProjects 


projectsOn1stPage = projects.slice(0,10)
projectsOn2ndPage = projects.slice(10,20)
projectsOn5thPage = projects.slice(40,50)
startIndex = n*numberOProjects - numberOfProjects
projectsNthPage = projects.slice(startIndex, startIndex+ numberOfProjects)
projectsOn9thPage = projects.slice(9*10 - 10 , 9*10) = (80,90) -->
